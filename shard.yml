name: crystal-term
version: 0.2.0

authors:
  - Chris Watson <cawatson1993@gmail.com>

description: |
  A modular collection of Crystal libraries for building terminal/CLI applications.
  This is the monorepo root that manages versions for all crystal-term modules.

# Root-managed development workflow:
# - Dependencies below use local paths to the sub-shards under ./shards
# - Each shard continues to declare GitHub-based dependencies in its own shard.yml
# - Run all builds/tests/examples from the repo root so the root shard.yml is used

targets:
  # Individual modules can be built from their respective directories
  # This root shard does not define executable targets

crystal: ">= 1.0.0"

license: MIT

# Use local path dependencies for all sub-shards
# This lets Crystal resolve inter-module dependencies locally when invoked from root

dependencies:
  term-color:
    path: ./shards/color
  term-cursor:
    path: ./shards/cursor
  term-prompt:
    path: ./shards/prompt
  term-reader:
    path: ./shards/reader
  term-screen:
    path: ./shards/screen
  term-spinner:
    path: ./shards/spinner
  term-terminfo:
    path: ./shards/terminfo
  term-progress:
    path: ./shards/progress

# Dev dependencies used when running specs from the monorepo root
# (e.g., `crystal spec shards/reader/spec`)

development_dependencies:
  spectator:
    gitlab: arctic-fox/spectator
    version: ~> 0.12.0
