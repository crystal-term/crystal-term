name: Release Crystal-Term Modules

on:
  push:
    branches:
      - main
    paths:
      - 'shard.yml'  # Only trigger when root shard.yml changes

  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force release even if version unchanged'
        required: false
        default: 'false'
        type: boolean

jobs:
  detect-version-change:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need previous commit to compare

      - name: Extract current version
        id: version
        run: |
          VERSION=$(awk '/^version:/ {print $2}' shard.yml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Check if version changed
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_release }}" == "true" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Force release requested"
          else
            # Check if version changed in the last commit
            PREV_VERSION=$(git show HEAD~1:shard.yml | awk '/^version:/ {print $2}' || echo "")
            CURR_VERSION="${{ steps.version.outputs.version }}"
            
            if [[ "$PREV_VERSION" != "$CURR_VERSION" ]]; then
              echo "changed=true" >> $GITHUB_OUTPUT
              echo "Version changed: $PREV_VERSION -> $CURR_VERSION"
            else
              echo "changed=false" >> $GITHUB_OUTPUT
              echo "Version unchanged: $CURR_VERSION"
            fi
          fi

  create-release:
    needs: detect-version-change
    if: needs.detect-version-change.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.detect-version-change.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Propagate version to all modules
        run: |
          echo "🚀 Propagating version $VERSION to all modules..."
          chmod +x scripts/propagate-version.sh
          ./scripts/propagate-version.sh

      - name: Create release notes
        run: |
          cat > RELEASE_NOTES.md << EOF
          # Crystal-Term v$VERSION
          
          This release updates all Crystal-Term modules to version $VERSION.
          
          ## Updated Modules
          
          - **term-color** v$VERSION - Terminal color capabilities detection
          - **term-cursor** v$VERSION - Terminal cursor movement and manipulation  
          - **term-prompt** v$VERSION - Interactive command line prompts
          - **term-reader** v$VERSION - Terminal input reading with line editing
          - **term-screen** v$VERSION - Terminal screen size detection
          - **term-spinner** v$VERSION - Terminal spinners and progress indicators
          - **term-terminfo** v$VERSION - Cross-platform terminal information
          
          ## Installation
          
          Add individual modules to your \`shard.yml\`:
          
          \`\`\`yaml
          dependencies:
            term-prompt:
              github: crystal-term/prompt
              version: $VERSION
          \`\`\`
          
          ## What's Changed
          
          - All modules updated to v$VERSION
          - Synchronized version numbers across all modules
          - Updated inter-module dependencies to use version pins
          
          ## Individual Module Releases
          
          Each module is released separately to its own repository:
          - [crystal-term/color](https://github.com/crystal-term/color/releases)
          - [crystal-term/cursor](https://github.com/crystal-term/cursor/releases) 
          - [crystal-term/prompt](https://github.com/crystal-term/prompt/releases)
          - [crystal-term/reader](https://github.com/crystal-term/reader/releases)
          - [crystal-term/screen](https://github.com/crystal-term/screen/releases)
          - [crystal-term/spinner](https://github.com/crystal-term/spinner/releases)
          - [crystal-term/terminfo](https://github.com/crystal-term/terminfo/releases)
          EOF

      - name: Commit propagated changes
        run: |
          git add .
          git commit -m "Release v$VERSION

          - Propagated version $VERSION to all modules
          - Updated inter-module dependencies to use version pins
          - Generated via automated release workflow" || echo "No changes to commit"

      - name: Create and push tag
        run: |
          git tag -a "v$VERSION" -m "Release Crystal-Term v$VERSION"
          git push origin main
          git push origin "v$VERSION"

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.VERSION }}
          release_name: Crystal-Term v${{ env.VERSION }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false

      - name: Summary
        run: |
          echo "🎉 Release v$VERSION completed successfully!"
          echo ""
          echo "📋 Summary:"
          echo "  - Version: $VERSION"
          echo "  - Modules updated: 7"
          echo "  - Tag created: v$VERSION"
          echo "  - GitHub release created"
          echo ""
          echo "📝 Note: Individual module releases should be created manually"
          echo "in their respective repositories using the updated versions."